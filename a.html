<html>
    <head>
        <style>
            input[type='email'] {border:5px green solid;}

            input[type='text'] {border:5px red solid;}

            ul>li {color:red;}

            a+p{color:red; font-size: 30px;}

            a:hover {color:yellow;}

            li:nth-child(2){background-color:bisque ;}

            p:not (#i1) {border:5px blue dotted;}

            p::before {content:"hey";}

             p::after {content:"bye";}

             p::first-letter {font-size: 50; color: yellow;}




        </style>
    </head>

        <a href="#">click here</a>

            <li>dog</li>

        </ul>
        <form>

            email: <input type="email">

</html>
